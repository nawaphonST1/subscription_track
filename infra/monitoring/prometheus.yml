global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/jenkins-slo-alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "jenkins"
    metrics_path: "/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["jenkins:8080", "host.docker.internal:8080"]
        labels:
          service: "jenkins-ci"
          environment: "lab09"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
