apiVersion: v1
kind: Service
metadata:
  name: subtracker-api
  labels:
    app: subtracker-api
    app.kubernetes.io/name: subtracker-api
    app.kubernetes.io/part-of: subscription-track
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: subtracker-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subtracker-api
  labels:
    app: subtracker-api
    app.kubernetes.io/name: subtracker-api
    app.kubernetes.io/part-of: subscription-track
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subtracker-api
  template:
    metadata:
      labels:
        app: subtracker-api
        app.kubernetes.io/name: subtracker-api
        app.kubernetes.io/part-of: subscription-track
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/nawaphonst1/subscription_track-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: APP_HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "subtracker_db"
            - name: DB_USER
              value: "postgres"
            - name: DATABASE_URL
              value: "postgresql://postgres:password123@postgres:5432/subtracker_db?schema=public&connection_limit=20"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: subtracker-secrets
                  key: jwt-secret
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subtracker-worker
  labels:
    app: subtracker-worker
    app.kubernetes.io/name: subtracker-worker
    app.kubernetes.io/part-of: subscription-track
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subtracker-worker
  template:
    metadata:
      labels:
        app: subtracker-worker
        app.kubernetes.io/name: subtracker-worker
        app.kubernetes.io/part-of: subscription-track
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: ghcr.io/nawaphonst1/subscription_track-api:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/worker.js"]
          env:
            - name: NODE_ENV
              value: "production"
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "subtracker_db"
            - name: DB_USER
              value: "postgres"
            - name: DATABASE_URL
              value: "postgresql://postgres:password123@postgres:5432/subtracker_db?schema=public&connection_limit=10"
            - name: PUSH_PROVIDER
              value: "stub"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
