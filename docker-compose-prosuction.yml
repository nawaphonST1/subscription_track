# Production Compose — root-level counterpart to the canonical local dev
# `docker-compose.yml` (same services: api, postgres, redis, worker, nginx).
#
# Secrets live ONLY in apps/server/.env.production (never committed — copy
# apps/server/.env.production.example and fill in real values; same file
# used by apps/server/docker-compose-prosuction.yml, so there is one secrets
# source of truth regardless of which production compose file you run).
# Every secret-bearing service loads it via `env_file:`, resolved relative to
# THIS file's directory — unlike `--env-file`/the auto-loaded `.env`, that
# does not depend on your current directory or on remembering a flag. If
# apps/server/.env.production is missing, `docker compose` refuses to start
# instead of silently falling back to the dev defaults below.
#
# Usage (from anywhere, no --env-file needed):
#   docker compose -f docker-compose-prosuction.yml config         # validate
#   docker compose -f docker-compose-prosuction.yml run --rm migrate   # once, before first `up`
#   docker compose -f docker-compose-prosuction.yml up -d
#
# Hardening vs. the local dev `docker-compose.yml`:
#   - PostgreSQL publishes NO host port (dev publishes 5432:5432 for host
#     tooling). Redis already had none. Both stay internal to the Compose
#     network, reachable only from api/worker/migrate.
#   - All secrets come from apps/server/.env.production via `env_file:` —
#     the dev file's `${DB_PASSWORD:-password123}`-style defaults are gone
#     entirely, so nothing falls back to a weak, committed-looking default.
#   - api/worker build the `runtime` target (compiled dist/ + pruned prod
#     node_modules, non-root `node` user) — not `development` with
#     bind-mounted source, hot reload, and auto-seed.
#   - Migrations are a separate one-off `migrate` job (profile-gated, never
#     started by `up`), not run automatically by the api container on every
#     start, so scaling api/worker never races a migration.
#   - Nginx publishes host port 80 instead of the dev convenience port 3000.
#
# NOT done here (ask before adding):
#   - A registry image reference — api/worker build from local source via
#     Buildx; swap `build:` for `image: <registry>/subscription-track-api:<tag>`
#     once images are actually pushed somewhere.

# DP-510. Explicit project name, distinct from docker-compose.yml's
# subscription-track-dev, so the two can never collide on container/network/
# volume names if ever run on the same host. Volumes below are NOT pinned to
# explicit names (unlike the dev file): this stack has never actually been
# deployed anywhere (confirmed — no running containers on the Azure VM prior
# to this change, and the DP-5 monitoring plan lists this stack's deployment
# as still TODO), so there is no existing data under the old implicit name to
# preserve. They will simply be created as subscription-track-prod_*.
name: subscription-track-prod

services:
  api:
    build:
      context: ./apps/server
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_HOST: 0.0.0.0
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
    env_file:
      - apps/server/.env.production # must define DB_NAME, DB_USER, DB_PASSWORD, DATABASE_URL, JWT_SECRET
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # No `ports:` — only Nginx is host-facing; reach the API via the
    # `api:8080` Compose DNS name, or through Nginx on the host.

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - apps/server/.env.production # must define POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No `ports:` — database stays internal to the Compose network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No `ports:` — cache/queue stays internal to the Compose network.

  worker:
    build:
      context: ./apps/server
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
    env_file:
      # Must define DATABASE_URL. Also defines PUSH_PROVIDER: 'stub' never
      # contacts a real push service; set PUSH_PROVIDER=fcm with
      # FCM_SERVICE_ACCOUNT_JSON for real delivery — no silent fallback to fcm.
      - apps/server/.env.production
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-off migration job. The `runtime` image prunes devDependencies
  # (including the `prisma` CLI), so migrations run from the `deps` stage,
  # which still has it. Not started by `up` — run explicitly:
  #   docker compose -f docker-compose-prosuction.yml run --rm migrate
  migrate:
    build:
      context: ./apps/server
      target: deps
    env_file:
      - apps/server/.env.production # must define DATABASE_URL
    command: ["pnpm", "prisma:migrate:deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate

  # DP-507. nginx:1.27-alpine is EOL (Docker Hub stopped rebuilding that tag
  # in April 2025) and carries dozens of known CVEs in its Alpine base
  # packages; 1.30-alpine is the actively-maintained stable branch. Bumped
  # here because this is the exact service a TLS hardening ticket touches —
  # shipping new TLS config on a known-EOL image would undercut the point.
  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      api:
        condition: service_healthy

  # DP-507. Renews the certificate nginx serves on 8443. NOT started by a
  # plain `up` (profile-gated): the first certificate has to be issued by
  # hand first — see the "First deploy" steps at the top of
  # infra/nginx/nginx.prod.conf. Once that's done:
  #   docker compose -f docker-compose-prosuction.yml --profile tls up -d certbot
  certbot:
    image: certbot/certbot:v5.8.0
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done"
    profiles:
      - tls

volumes:
  postgres_data:
  redis_data:
  certbot-webroot:
  certbot-certs:
