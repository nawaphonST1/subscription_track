# production nginx with TLS termination.
#
# WHERE THIS RUNS: docker-compose-prosuction.yml only. The shared
# infra/nginx/nginx.conf (used by both the dev compose file and, until now,
# production) stays HTTP-only and unmodified in its server-block shape, so
# `docker compose up` on a dev machine never needs a certificate that doesn't
# exist there. This file is production-only and requires a real certificate
# before nginx will even start — see "First deploy" below.
#
# CHANGE_ME_DOMAIN appears in two places below (server_name, and both
# ssl_certificate paths). Replace every occurrence with the real public
# domain before deploying — do not leave the placeholder in, and do not
# guess a domain here.
#
# First deploy (one-time, on the Azure production VM):
#   1. Comment out the second `server { listen 8443 ssl; ... }` block below
#      (or just keep using the plain infra/nginx/nginx.conf for one boot) so
#      nginx can start with no certificate yet.
#   2. Bring the stack up so the ACME HTTP-01 challenge path is reachable:
#        docker compose -f docker-compose-prosuction.yml up -d nginx
#   3. Issue the real certificate (needs DNS already pointed at this VM's
#      public IP, and port 80 reachable from the internet):
#        docker compose -f docker-compose-prosuction.yml run --rm certbot \
#          certonly --webroot -w /var/www/certbot \
#          -d CHANGE_ME_DOMAIN --email CHANGE_ME_EMAIL \
#          --agree-tos --no-eff-email
#   4. Uncomment the 8443 server block, replace CHANGE_ME_DOMAIN everywhere,
#      then reload: docker compose -f docker-compose-prosuction.yml up -d nginx
#   5. Start the renewal loop: docker compose -f docker-compose-prosuction.yml
#      --profile tls up -d certbot
#
# None of the above can be executed from this review session: it needs a
# real domain with DNS already pointed here, and port 80/443 reachable from
# the public internet, neither of which exists in this environment.
events {}

http {
    upstream backend {
        server api:8080;
    }

    # same format as infra/nginx/nginx.conf; see that file's comment.
    log_format  combined_rt  '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" $request_time';
    access_log  /dev/stdout  combined_rt;

    # Plain HTTP: serves the ACME HTTP-01 challenge for certbot, redirects
    # everything else to HTTPS. Always present — certbot's renewal also goes
    # through here, not through the HTTPS side.
    server {
        listen 8080;
        server_name CHANGE_ME_DOMAIN;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name CHANGE_ME_DOMAIN;

        ssl_certificate     /etc/letsencrypt/live/CHANGE_ME_DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/CHANGE_ME_DOMAIN/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
