services:
  api:
    build:
      context: ./apps/server
      target: development
    environment:
      NODE_ENV: development
      APP_HOST: 0.0.0.0
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-subtracker_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password123}@postgres:5432/${DB_NAME:-subtracker_db}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-dev-only-local-secret-not-for-production-min-32-chars-long}
    ports:
      - "8080:8080"
    volumes:
      - ./apps/server/src:/app/src
      - ./apps/server/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    init: true

  postgres:
    image: postgres:16-alpine
    container_name: subtracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-subtracker_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: subtracker_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./apps/server
      target: development
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password123}@postgres:5432/${DB_NAME:-subtracker_db}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 'stub' is for local development/automated tests only: it never
      # contacts a real push provider. Set PUSH_PROVIDER=fcm with
      # FCM_SERVICE_ACCOUNT_JSON for real delivery; there is no silent
      # fallback if PUSH_PROVIDER is unset or fcm credentials are missing.
      PUSH_PROVIDER: stub
    # Migration ownership: the `api` service's development-stage image already
    # runs `pnpm prisma:migrate:deploy` on startup (see apps/server/Dockerfile
    # `development` target CMD), so the worker does not run it again here to
    # avoid two long-running services independently owning migration
    # execution. On a fresh `docker compose up` there is a small local-dev-only
    # race window where the worker can start querying before `api` finishes
    # migrating; this is an accepted, documented tradeoff rather than added
    # orchestration, since `api` has no healthcheck this compose file can wait
    # on. Restart the worker if it logs schema errors on a first-ever `up`.
    command: ["pnpm", "start:worker:dev"]
    volumes:
      - ./apps/server/src:/app/src
      - ./apps/server/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true

  # Nginx remains disabled until its reviewed configuration exists. When it is
  # enabled, it will publish 3000:8080 and the API `ports` mapping will be
  # removed so API traffic stays on the Compose network.
  # nginx:
  #   image: nginx:<pinned-version>
  #   ports:
  #     - "3000:8080"

volumes:
  postgres_data:
  redis_data:
