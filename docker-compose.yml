# Overridable via the COMPOSE_PROJECT_NAME env var so two checkouts of this
# repo on the same host (e.g. two developers sharing a VM) don't collide on
# the same project name and silently share container/network/image names.
name: ${COMPOSE_PROJECT_NAME:-subscription-track-dev}

# The two named volumes below are pinned to their pre-existing literal names
# (subscription_track_postgres_data, subscription_track_redis_data) so this
# rename doesn't orphan local dev data created before this change. Verified
# by recreating the postgres container against an existing volume: Compose
# prints a one-time warning ("already exists but was created for project
# \"subscription_track\" (expected \"subscription-track-dev\")") because the
# volume's project label predates this rename, but it attaches to the same
# volume regardless — confirmed real data (all app tables) survived the
# recreation. The warning is cosmetic and expected on any host with a
# volume from before this change; a fresh clone never sees it.
services:
  api:
    build:
      context: ./apps/server
      target: development
    environment:
      NODE_ENV: development
      APP_HOST: 0.0.0.0
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-subtracker_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password123}@postgres:5432/${DB_NAME:-subtracker_db}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-dev-only-local-secret-not-for-production-min-32-chars-long}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./apps/server/src:/app/src
      - ./apps/server/prisma:/app/prisma
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  postgres:
    image: postgres:16-alpine
    container_name: subtracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-subtracker_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: subtracker_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./apps/server
      target: development
    environment:
      NODE_ENV: development
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password123}@postgres:5432/${DB_NAME:-subtracker_db}?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 'stub' is for local development/automated tests only: it never
      # contacts a real push provider. Set PUSH_PROVIDER=fcm with
      # FCM_SERVICE_ACCOUNT_JSON for real delivery; there is no silent
      # fallback if PUSH_PROVIDER is unset or fcm credentials are missing.
      PUSH_PROVIDER: stub
    # Migration ownership: the `api` service's development-stage image already
    # runs `pnpm prisma:migrate:deploy` on startup (see apps/server/Dockerfile
    # `development` target CMD), so the worker does not run it again here to
    # avoid two long-running services independently owning migration
    # execution. On a fresh `docker compose up` there is a small local-dev-only
    # race window where the worker can start querying before `api` finishes
    # migrating; this is an accepted, documented tradeoff rather than added
    # orchestration, since `api` has no healthcheck this compose file can wait
    # on. Restart the worker if it logs schema errors on a first-ever `up`.
    command: ["pnpm", "start:worker:dev"]
    volumes:
      - ./apps/server/src:/app/src
      - ./apps/server/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true

  # DP-508. 1.27-alpine is EOL (Docker Hub stopped rebuilding that tag in
  # 2025); 1.30-alpine is the actively-maintained stable branch, same tag
  # already adopted for production in docker-compose-prosuction.yml.
  nginx:
    image: nginx:1.30-alpine
    ports:
      - "3000:8080"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
    name: subscription_track_postgres_data
  redis_data:
    name: subscription_track_redis_data
