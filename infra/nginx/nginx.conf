events {}

http {
    upstream backend {
        server api:8080;
    }

    # Superset of nginx's built-in `combined` format (one field
    # appended), so anything else still reading combined keeps working.
    # Logged to stdout, not a file: that's the only thing the Alloy agent on
    # the production VM actually reads (loki.source.docker in
    # infra/monitoring/prod-agent/config.alloy pulls container stdout/stderr
    # via the Docker socket — a file on disk would never reach it).
    log_format  combined_rt  '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" $request_time';
    access_log  /dev/stdout  combined_rt;

    server {
        listen 8080;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
