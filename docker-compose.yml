services:
  api:
    build:
      context: ./apps/server
      target: development
    environment:
      NODE_ENV: development
      APP_HOST: 0.0.0.0
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-subtracker_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password123}
      DATABASE_URL: "postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password123}@postgres:5432/${DB_NAME:-subtracker_db}?schema=public"
    ports:
      - "8080:8080"
    volumes:
      - ./apps/server/src:/app/src
      - ./apps/server/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    init: true

  postgres:
    image: postgres:16-alpine
    container_name: subtracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-subtracker_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis remains disabled until ADD-ASYNC-01 introduces its configuration
  # contract and client dependencies.
  # redis:
  #   image: redis:<pinned-version>

  # The worker remains disabled until BullMQ worker bootstrap is implemented.
  # worker:
  #   build:
  #     context: ./apps/server
  #     target: runtime
  #   command: ["node", "dist/worker.js"]

  # Nginx remains disabled until its reviewed configuration exists. When it is
  # enabled, it will publish 3000:8080 and the API `ports` mapping will be
  # removed so API traffic stays on the Compose network.
  # nginx:
  #   image: nginx:<pinned-version>
  #   ports:
  #     - "3000:8080"

volumes:
  postgres_data:
