# ==============================================================================
# Kubernetes Production Secrets (Default Secrets for K8s & ArgoCD GitOps)
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: default
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: subscription-track
type: Opaque
stringData:
  POSTGRES_DB: "subtracker_db"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "password123"
---
apiVersion: v1
kind: Secret
metadata:
  name: subtracker-secrets
  namespace: default
  labels:
    app: subtracker-api
    app.kubernetes.io/name: subtracker-api
    app.kubernetes.io/part-of: subscription-track
type: Opaque
stringData:
  jwt-secret: "super-secure-production-secret-key-32chars"
  JWT_SECRET: "super-secure-production-secret-key-32chars"
---
apiVersion: v1
kind: Secret
metadata:
  name: backup-azure-secret
  namespace: default
  labels:
    app: postgres-backup
    app.kubernetes.io/name: postgres-backup
    app.kubernetes.io/part-of: subscription-track
type: Opaque
stringData:
  AZURE_STORAGE_ACCOUNT: "subtrackerprodstorage"
  AZURE_STORAGE_CONTAINER: "database-backups"
  AZURE_STORAGE_KEY: "default-stub-key"
