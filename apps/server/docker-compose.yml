version: '3.8'

services:
  # 1. Database Service (ทุกคนในทีมจะใช้ Postgres สเปกเดียวกัน)
  postgres:
    image: postgres:16-alpine
    container_name: subtracker_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: subtracker_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d subtracker_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. NestJS API Service (รันโหมด Dev พร้อม Hot-reload)
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: subtracker_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      APP_HOST: 0.0.0.0
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: subtracker_db
      DB_USER: postgres
      DB_PASSWORD: password123
      DATABASE_URL: "postgresql://postgres:password123@postgres:5432/subtracker_db?schema=public"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    ports:
      - "8080:8080"

volumes:
  postgres_data: