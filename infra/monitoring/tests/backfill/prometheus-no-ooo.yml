# PHASE 1.5 — ROUND B Prometheus config (the control).
#
# Byte-for-byte the phase-1 ../../prometheus/prometheus.yml, with ONE
# difference: the whole `storage.tsdb.out_of_order_time_window` setting is
# absent, so Prometheus runs with its default of 0s and rejects any sample
# older than the head's max time.
#
# Round A (phase-1 config, 1h window) vs round B (this file, no window) is the
# entire experiment. Keep the two scrape_configs identical — otherwise the
# rounds are not comparable.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    site: monitoring-vm

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: monitoring-host
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://grafana:3000/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
