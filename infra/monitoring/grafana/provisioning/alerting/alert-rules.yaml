# DP-504 — Grafana alert rules, provisioned from this file.
#
# Generated by scripts/dp5/gen-alerts.py — edit that, not this.
#
# Grafana 12.1.x file provisioning. Rules provisioned this way are read-only in
# the UI, which is the point: the file in git is the only source of truth.
#
# EVERY rule sets noDataState and execErrState explicitly. The reason is this
# project's network: the monitoring VM lives behind a university captive portal
# whose session expires about once a day, and production pushes to it through a
# reverse SSH tunnel that dies with that session. Under Grafana's default
# noDataState (NoData -> alerting), every single rule would fire every morning.
#
#   noDataState: OK        - absence of data is not evidence of a problem. No
#                            traffic produces no rate(); a dead tunnel produces
#                            no prod series. The one rule below whose job is to
#                            notice that absence covers both cases.
#   noDataState: Alerting  - only dp5-prod-ingestion-halt, where an empty query
#                            result IS the condition being detected.
#   execErrState: Error    - a query error means a broken rule, not a network
#                            blip: Grafana and Prometheus are the same host and
#                            the datasource is reachable over the Compose
#                            network. Surfacing it as an error is correct.
#
# See docs/dp5-loop-verification.md for the tunnel-drop vs real-outage table.
apiVersion: 1
groups:
  - orgId: 1
    name: "api"
    folder: "DP-5 Alerts"
    interval: "1m"
    rules:
      - uid: "dp5-api-down"
        title: "API down"
        condition: "B"
        for: "2m"
        noDataState: "OK"
        execErrState: "Error"
        labels:
          severity: "critical"
        annotations:
          summary: "The blackbox probe of production has been failing for 2 minutes"
          description: "probe_success is 0. The probe runs from the monitoring VM, so a lost captive-portal session makes production look down when it is not. If prod-ingestion-halt is firing at the same time, suspect the monitoring VM's captive-portal session before suspecting production."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              datasource:
                type: "prometheus"
                uid: "prometheus"
              expr: "min(probe_success{job=\"blackbox-http\"})"
              instant: true
              range: false
              editorMode: "code"
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "threshold"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "A"
              conditions:
                - type: "query"
                  evaluator:
                    type: "lt"
                    params:
                      - 1
                  operator:
                    type: "and"
                  query:
                    params:
                      - "B"
                  reducer:
                    type: "last"
              intervalMs: 1000
              maxDataPoints: 43200
      - uid: "dp5-api-5xx"
        title: "5xx ratio above 5%"
        condition: "B"
        for: "5m"
        noDataState: "OK"
        execErrState: "Error"
        labels:
          severity: "critical"
        annotations:
          summary: "More than 5% of requests are failing with a 5xx"
          description: "Measured over a 5-minute window. status=\"aborted\" is a string and never matches 5.., so client disconnects do not inflate this; watch the Aborted requests panel for those. No traffic means no data, which is deliberately not an alert."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              datasource:
                type: "prometheus"
                uid: "prometheus"
              expr: "sum(rate(http_requests_total{status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 0.0001) * 100"
              instant: true
              range: false
              editorMode: "code"
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "threshold"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "A"
              conditions:
                - type: "query"
                  evaluator:
                    type: "gt"
                    params:
                      - 5
                  operator:
                    type: "and"
                  query:
                    params:
                      - "B"
                  reducer:
                    type: "last"
              intervalMs: 1000
              maxDataPoints: 43200
      - uid: "dp5-api-latency"
        title: "p95 latency above 1s"
        condition: "B"
        for: "5m"
        noDataState: "OK"
        execErrState: "Error"
        labels:
          severity: "warning"
        annotations:
          summary: "p95 request latency has been above 1s for 5 minutes"
          description: "Interpolated from the histogram; the top finite bucket is 10s. On a burstable B2als v2 this is also what exhausted CPU credits look like — check the CPU panel before blaming the code."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              datasource:
                type: "prometheus"
                uid: "prometheus"
              expr: "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))"
              instant: true
              range: false
              editorMode: "code"
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "threshold"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "A"
              conditions:
                - type: "query"
                  evaluator:
                    type: "gt"
                    params:
                      - 1
                  operator:
                    type: "and"
                  query:
                    params:
                      - "B"
                  reducer:
                    type: "last"
              intervalMs: 1000
              maxDataPoints: 43200
  - orgId: 1
    name: "host"
    folder: "DP-5 Alerts"
    interval: "1m"
    rules:
      - uid: "dp5-host-disk"
        title: "Disk above 85%"
        condition: "B"
        for: "10m"
        noDataState: "OK"
        execErrState: "Error"
        labels:
          severity: "warning"
        annotations:
          summary: "Root filesystem above 85% on at least one monitored host"
          description: "Covers both VMs. On the monitoring VM, Prometheus is capped by --storage.tsdb.retention.size=3GB and Loki by a 7-day retention, so a rise here is usually container logs or images, not the TSDB."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              datasource:
                type: "prometheus"
                uid: "prometheus"
              expr: "100 - (min(node_filesystem_avail_bytes{mountpoint=\"/\", fstype!~\"tmpfs|overlay|squashfs|ramfs\"} / node_filesystem_size_bytes{mountpoint=\"/\", fstype!~\"tmpfs|overlay|squashfs|ramfs\"}) * 100)"
              instant: true
              range: false
              editorMode: "code"
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "threshold"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "A"
              conditions:
                - type: "query"
                  evaluator:
                    type: "gt"
                    params:
                      - 85
                  operator:
                    type: "and"
                  query:
                    params:
                      - "B"
                  reducer:
                    type: "last"
              intervalMs: 1000
              maxDataPoints: 43200
      - uid: "dp5-host-ram"
        title: "Available RAM below 10%"
        condition: "B"
        for: "10m"
        noDataState: "OK"
        execErrState: "Error"
        labels:
          severity: "warning"
        annotations:
          summary: "Less than 10% of RAM is available on at least one monitored host"
          description: "Expressed as used% > 90 so the threshold reads the same way as the others. Production is a 4 GiB VM running the app, the database, Redis and five agent containers."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              datasource:
                type: "prometheus"
                uid: "prometheus"
              expr: "100 - (min(node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100)"
              instant: true
              range: false
              editorMode: "code"
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "threshold"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "A"
              conditions:
                - type: "query"
                  evaluator:
                    type: "gt"
                    params:
                      - 90
                  operator:
                    type: "and"
                  query:
                    params:
                      - "B"
                  reducer:
                    type: "last"
              intervalMs: 1000
              maxDataPoints: 43200
      - uid: "dp5-host-cpu"
        title: "CPU above 90%"
        condition: "B"
        for: "10m"
        noDataState: "OK"
        execErrState: "Error"
        labels:
          severity: "warning"
        annotations:
          summary: "CPU above 90% for 10 minutes on at least one monitored host"
          description: "On the production B2als v2 this burns CPU credits; sustained load will be throttled to the 2 vCPU baseline rather than failing outright."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              datasource:
                type: "prometheus"
                uid: "prometheus"
              expr: "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)"
              instant: true
              range: false
              editorMode: "code"
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "threshold"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "A"
              conditions:
                - type: "query"
                  evaluator:
                    type: "gt"
                    params:
                      - 90
                  operator:
                    type: "and"
                  query:
                    params:
                      - "B"
                  reducer:
                    type: "last"
              intervalMs: 1000
              maxDataPoints: 43200
      - uid: "dp5-container-restarts"
        title: "Container restarting repeatedly"
        condition: "B"
        for: "0s"
        noDataState: "OK"
        execErrState: "Error"
        labels:
          severity: "warning"
        annotations:
          summary: "A container restarted more than 3 times in 10 minutes"
          description: "cAdvisor has no restart counter, so this counts changes of the container start timestamp. `for` is 0s on purpose: the 10-minute range already is the window."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              datasource:
                type: "prometheus"
                uid: "prometheus"
              expr: "max(changes(container_start_time_seconds{name!=\"\"}[10m]))"
              instant: true
              range: false
              editorMode: "code"
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "threshold"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "A"
              conditions:
                - type: "query"
                  evaluator:
                    type: "gt"
                    params:
                      - 3
                  operator:
                    type: "and"
                  query:
                    params:
                      - "B"
                  reducer:
                    type: "last"
              intervalMs: 1000
              maxDataPoints: 43200
  - orgId: 1
    name: "datastores"
    folder: "DP-5 Alerts"
    interval: "1m"
    rules:
      - uid: "dp5-store-exporter-down"
        title: "Postgres or Redis unreachable"
        condition: "B"
        for: "2m"
        noDataState: "OK"
        execErrState: "Error"
        labels:
          severity: "critical"
        annotations:
          summary: "The Postgres or Redis exporter has been down for 2 minutes"
          description: "`up` is synthesised by Alloy's own scrape on the production VM and pushed in, so this reports the exporter's view of the datastore, not the tunnel. If prod-ingestion-halt is firing at the same time, suspect the monitoring VM's captive-portal session before suspecting production."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              datasource:
                type: "prometheus"
                uid: "prometheus"
              expr: "min(up{job=~\"postgres|redis\"})"
              instant: true
              range: false
              editorMode: "code"
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "threshold"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "A"
              conditions:
                - type: "query"
                  evaluator:
                    type: "lt"
                    params:
                      - 1
                  operator:
                    type: "and"
                  query:
                    params:
                      - "B"
                  reducer:
                    type: "last"
              intervalMs: 1000
              maxDataPoints: 43200
      - uid: "dp5-queue-scrape-failing"
        title: "Queue scrape failing"
        condition: "B"
        for: "5m"
        noDataState: "OK"
        execErrState: "Error"
        labels:
          severity: "warning"
        annotations:
          summary: "The worker cannot read the BullMQ queue (usually Redis)"
          description: "worker_queue_scrape_ok is 0. The worker_queue_jobs series are dropped rather than frozen at their last values, so the queue panels go blank instead of showing a reassuring empty queue."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              datasource:
                type: "prometheus"
                uid: "prometheus"
              expr: "min(worker_queue_scrape_ok)"
              instant: true
              range: false
              editorMode: "code"
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "threshold"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "A"
              conditions:
                - type: "query"
                  evaluator:
                    type: "lt"
                    params:
                      - 1
                  operator:
                    type: "and"
                  query:
                    params:
                      - "B"
                  reducer:
                    type: "last"
              intervalMs: 1000
              maxDataPoints: 43200
      - uid: "dp5-bullmq-failures"
        title: "BullMQ job failures rising"
        condition: "B"
        for: "0s"
        noDataState: "OK"
        execErrState: "Error"
        labels:
          severity: "warning"
        annotations:
          summary: "More than 5 renewal-reminder jobs failed in the last 10 minutes"
          description: "Uses the counter, not worker_queue_jobs{state=\"failed\"} — that gauge plateaus at the 500 retained records BullMQ keeps and stops moving."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              datasource:
                type: "prometheus"
                uid: "prometheus"
              expr: "sum(increase(worker_jobs_processed_total{result=\"failure\"}[10m]))"
              instant: true
              range: false
              editorMode: "code"
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "threshold"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "A"
              conditions:
                - type: "query"
                  evaluator:
                    type: "gt"
                    params:
                      - 5
                  operator:
                    type: "and"
                  query:
                    params:
                      - "B"
                  reducer:
                    type: "last"
              intervalMs: 1000
              maxDataPoints: 43200
  - orgId: 1
    name: "pipeline"
    folder: "DP-5 Alerts"
    interval: "1m"
    rules:
      - uid: "dp5-prod-ingestion-halt"
        title: "No data arriving from production"
        condition: "B"
        for: "2m"
        noDataState: "Alerting"
        execErrState: "Error"
        labels:
          severity: "warning"
        annotations:
          summary: "Production has not pushed any samples for about 5 minutes"
          description: "DISTINCT from 'API down'. Production pushes through a reverse SSH tunnel that only exists while the monitoring VM's captive-portal session is alive, so this fires on a dead session, a dead tunnel, a dead Alloy or a dead VM — and on none of those is the public site necessarily affected. Detection takes roughly 5 minutes of staleness (Prometheus' lookback) plus the 2-minute pending period. noDataState is Alerting here and only here: an empty result IS the signal."
        data:
          - refId: "A"
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "prometheus"
            model:
              refId: "A"
              datasource:
                type: "prometheus"
                uid: "prometheus"
              expr: "count(up{site=\"prod\"} == 1)"
              instant: true
              range: false
              editorMode: "code"
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: "B"
            datasourceUid: "__expr__"
            model:
              refId: "B"
              type: "threshold"
              datasource:
                type: "__expr__"
                uid: "__expr__"
              expression: "A"
              conditions:
                - type: "query"
                  evaluator:
                    type: "lt"
                    params:
                      - 1
                  operator:
                    type: "and"
                  query:
                    params:
                      - "B"
                  reducer:
                    type: "last"
              intervalMs: 1000
              maxDataPoints: 43200
