# Prometheus configuration — monitoring VM, DP-5 phase 1.
# Verified against the prom/prometheus v3.5.5 configuration reference.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    # Distinguishes series collected here from series pushed in by the
    # production VM (phase 3), which carry their own labels from Alloy.
    site: monitoring-vm

# No `storage:` block. The phase-1.5 backfill A/B test
# (infra/monitoring/tests/backfill/) measured a round WITH
# `out_of_order_time_window: 1h` against a round WITHOUT it and got identical
# results — S1/S2 (tunnel-style outage) 100% recovered either way, S3 (outage
# plus a simultaneous Alloy restart) 66.7% either way — with Prometheus'
# out-of-order counters at 0 in every run. Samples lost in S3 never reached
# Prometheus at all, so no storage setting could have saved them. The window
# was therefore removed rather than kept "just in case": it only widens the
# head block. S3 stays a documented KNOWN-LIMITATION, not a config problem.

scrape_configs:
  # Prometheus' own health and performance.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
    relabel_configs:
      - target_label: site
        replacement: monitoring-vm

  # The monitoring VM itself. See the node-exporter note in docker-compose.yml:
  # node_network_* here describes the exporter's container namespace.
  - job_name: monitoring-host
    static_configs:
      - targets: ["node-exporter:9100"]
    relabel_configs:
      - target_label: site
        replacement: monitoring-vm

  # Proves the blackbox exporter is wired up correctly while production does
  # not exist yet, by probing a target that is always reachable from inside
  # the compose network.
  # PHASE 3: replace the target with the public production URL
  # (https://<domain>/health/ready) — the relabel rules below stay as they are.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://grafana:3000/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
      - target_label: site
        replacement: monitoring-vm

# No scrape job points at the production VM on purpose: production pushes to
# this Prometheus via remote_write through the reverse tunnel (phase 3), so
# nothing here has to reach out to Azure.
